name: Booking reminders (hourly ping)

# Vercel Hobby allows only daily crons, so this free GitHub schedule pings the
# reminder endpoint every hour. Set two repository secrets:
#   SITE_URL    e.g. https://virtuousvogue.com
#   CRON_SECRET the same value as the CRON_SECRET env var on Vercel
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL or CRON_SECRET secret missing; skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
